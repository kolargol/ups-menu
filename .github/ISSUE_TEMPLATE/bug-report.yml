name: Bug report
description: Report a reproducible problem with a supported UPS
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: UPS Menu version
      description: Shown at the bottom of the application popover.
      placeholder: 1.0.0 (2)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: UPS manufacturer and model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
