name: UPSMenu
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: NO
schemes:
  UPSMenu:
    build:
      targets:
        UPSMenu: all
        UPSMenuTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UPSMenuTests
targets:
  UPSMenu:
    type: application
    platform: macOS
    sources:
      - path: UPSMenu
        excludes:
          - Assets.xcassets
    info:
      path: UPSMenu/Info.plist
      properties:
        CFBundleIconFile: AppIcon.icns
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.UPSMenu
        PRODUCT_NAME: UPS Menu
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  UPSMenuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UPSMenuTests
    dependencies:
      - target: UPSMenu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UPS Menu.app/Contents/MacOS/UPS Menu"
        BUNDLE_LOADER: "$(TEST_HOST)"

